name: Soul Ring Mentor Pact IssueOps

"on":
  issues:
    types:
      - opened

permissions:
  issues: write
  contents: read

jobs:
  soul-ring-mentor-comment:
    if: >-
      github.event.issue.pull_request == null &&
      (
        contains(github.event.issue.labels.*.name, 'soul-ring-mentor') ||
        startsWith(github.event.issue.title, '[Soul Ring Mentor]')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Comment with soul ring mentor pact commands
        uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;
            const username = issue.user.login;
            const issueUrl = issue.html_url;
            const safeTitle = issue.title
              .replaceAll("`", "'")
              .replaceAll('"', '\\"')
              .replace(/\r?\n/g, " ");
            const pactName = safeTitle.replace(/^\[Soul Ring Mentor\]\s*/i, "").trim() || "CyberHuaTuo Mentor Pact";
            const mentor = username;
            const apprentice = "apprentice-github";
            const body = [
              "## Soul Ring Mentor Pact",
              "",
              `@${username}, this issue can become a public CyberHuaTuo mentor-apprentice onboarding pact.`,
              "",
              "Use real GitHub usernames from the issue body before posting the pact. The pact uses current real snapshots only.",
              "",
              "Launch Closure Checklist before treating this mentor pact as part of the public market loop:",
              "```bash",
              `cyberhuatuo proof-pack --username ${username} --framework langchain --release-tag v0.2.5 --target-contributors 3`,
              `cyberhuatuo market-copy --username ${username} --framework langchain --release-tag v0.2.5 --target-contributors 3`,
              `cyberhuatuo market-ready --remote --strict-remote --username ${username} --framework langchain --release-tag v0.2.5 --target-contributors 3`,
              `cyberhuatuo record-return --username ${username} --framework langchain --surface "Mentor Pact Issue" --source-url ${issueUrl}`,
              "```",
              "",
              "```bash",
              `cyberhuatuo mentor ${mentor} ${apprentice} --framework langchain`,
              `cyberhuatuo challenge --username ${apprentice} --framework langchain`,
              `cyberhuatuo quest ${apprentice} --framework langchain`,
              `cyberhuatuo ladder ${apprentice} --framework langchain`,
              `cyberhuatuo duel ${mentor} ${apprentice} --framework langchain`,
              `cyberhuatuo campaign ${apprentice} --framework langchain`,
              "```",
              "",
              "Replace `apprentice-github` with a real apprentice before publishing the pact.",
              "",
              `Pact label: ${pactName}`,
              "",
              "Soul Ring Mentor Pact turns the invite into a repeat loop: mentor readiness, apprentice breakthrough target, review duty, first-ring challenge, and public follow-up.",
              "",
              "real-data pledge: mentor seniority, apprentice progress, review duty, and contribution claims must come from current real snapshots and are not invented.",
              "",
              "Repo: https://github.com/JinNing6/CyberHuaTuo-Plugin",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });
