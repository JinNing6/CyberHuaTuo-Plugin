name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and dev quality gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run lint
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q
      - name: Audit launch assets
        run: python -m cyberhuatuo launch-assets
      - name: Build release artifacts
        run: python -m build --sdist --wheel
      - name: Check release boundary
        run: python scripts/check_release_boundary.py
