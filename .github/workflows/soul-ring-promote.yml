name: Soul Ring Prescription Promotion

"on":
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  promote-first-soul-ring-prescription:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'first-soul-ring') &&
      contains(github.event.issue.labels.*.name, 'accepted-prescription') &&
      !contains(github.event.issue.labels.*.name, 'soul-ring-promoted-pr')
    runs-on: ubuntu-latest
    steps:
      - name: Promote accepted first soul ring issue to case PR
        uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;

            function parseIssueForm(body, heading) {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const pattern = new RegExp(`### ${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`, "i");
              const match = body.match(pattern);
              if (!match) return "";
              return match[1]
                .replace(/^- \\[[ xX]\\] .*$/gm, "")
                .replace(/<!--.*?-->/gs, "")
                .trim();
            }

            function yamlQuote(value) {
              return JSON.stringify(String(value || "").replace(/\r/g, ""));
            }

            function slugify(value) {
              const slug = String(value || "")
                .toLowerCase()
                .replace(/^\[soul ring prescription\]\s*/i, "")
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "")
                .slice(0, 64);
              return slug || `issue-${issue.number}`;
            }

            const parsed = {
              username: parseIssueForm(issue.body || "", "GitHub username") || issue.user.login,
              framework: parseIssueForm(issue.body || "", "Framework or tool") || "other",
              symptom: parseIssueForm(issue.body || "", "Real symptom and reproduction"),
              rootCause: parseIssueForm(issue.body || "", "Root cause"),
              prescription: parseIssueForm(issue.body || "", "Prescription / fix"),
              verification: parseIssueForm(issue.body || "", "Verification evidence"),
              safety: parseIssueForm(issue.body || "", "Safety and rollback"),
              evidenceUrl: parseIssueForm(issue.body || "", "Reviewable source or evidence URL"),
            };

            const framework = parsed.framework.toLowerCase().replace(/[^a-z0-9-]/g, "") || "other";
            const title = issue.title.replace(/^\[Soul Ring Prescription\]\s*/i, "").trim() || `Soul Ring Prescription ${issue.number}`;
            const titleSlug = slugify(title);
            const issueSequence = String(issue.number).padStart(3, "0");
            const caseId = `${framework}-soul-ring-issue-${issueSequence}`;
            const path = `cases/${framework}/community/${caseId}.md`;
            const created = new Date().toISOString().slice(0, 10);
            const sourceUrl = issue.html_url;
            const required = ["symptom", "rootCause", "prescription", "verification", "safety", "evidenceUrl"];
            const missing = required.filter((field) => !parsed[field]);
            if (missing.length) {
              core.setFailed(`Accepted prescription is missing required fields: ${missing.join(", ")}`);
              return;
            }
            let evidence;
            try {
              evidence = new URL(parsed.evidenceUrl);
            } catch {
              core.setFailed("Reviewable source or evidence URL must be a valid URL.");
              return;
            }
            if (!["http:", "https:"].includes(evidence.protocol)) {
              core.setFailed("Reviewable source or evidence URL must use HTTP(S).");
              return;
            }
            const signature = parsed.symptom
              .split("\n")
              .map((line) => line.trim())
              .find((line) => line.length >= 8 && /(error|exception|failed|failure|traceback|winerror|cannot|invalid)/i.test(line))
              || title;

            const content = [
              "---",
              `id: ${yamlQuote(caseId)}`,
              `title: ${yamlQuote(title)}`,
              `title_en: ${yamlQuote(title)}`,
              `framework: ${yamlQuote(framework)}`,
              'framework_version: ""',
              'language: "python"',
              "tags:",
              '  - "community"',
              '  - "first-soul-ring"',
              'severity: "medium"',
              'complexity: "moderate"',
              'quality_status: "reviewed"',
              'disease_category: "other"',
              'case_origin: "community-submission"',
              `reviewed_at: ${yamlQuote(created)}`,
              `reviewed_by: ${yamlQuote(context.actor)}`,
              "match_signatures:",
              `  - ${yamlQuote(signature.slice(0, 240))}`,
              'verification_method: "maintainer-reviewed-issue-evidence"',
              "evidence_urls:",
              `  - ${yamlQuote(evidence.toString())}`,
              "environment:",
              '  python_version: ">=3.9"',
              '  os: "any"',
              `created_at: ${yamlQuote(created)}`,
              `updated_at: ${yamlQuote(created)}`,
              "contributors:",
              `  - github: ${yamlQuote(parsed.username)}`,
              `source_url: ${yamlQuote(sourceUrl)}`,
              "related_cases: []",
              "---",
              "",
              "## Symptom Description",
              "",
              parsed.symptom || "_Maintainer note: fill in the real symptom before merge._",
              "",
              "## Root Cause Analysis",
              "",
              parsed.rootCause || "_Maintainer note: fill in the real root cause before merge._",
              "",
              "## Prescriptions",
              "",
              "### Prescription 1",
              "",
              parsed.prescription || "_Maintainer note: fill in the accepted fix before merge._",
              "",
              "## Verification Evidence",
              "",
              parsed.verification,
              "",
              "## Safety and Rollback",
              "",
              parsed.safety,
              "",
              "## References",
              "",
              `- ${sourceUrl}`,
              `- ${evidence.toString()}`,
              "",
            ].join("\n");

            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const baseBranch = repo.default_branch;
            const { data: baseRef } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${baseBranch}`,
            });
            const branch = `soul-ring/issue-${issue.number}-${titleSlug}`;

            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branch}`,
                sha: baseRef.object.sha,
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            let existingSha;
            try {
              const { data: existing } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch,
              });
              existingSha = existing.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: `Promote Soul Ring prescription from #${issue.number}`,
              content: Buffer.from(content, "utf8").toString("base64"),
              sha: existingSha,
            });

            const prBody = [
              `Promotes accepted First Soul Ring Prescription issue #${issue.number} into a reviewable CyberHuaTuo case file.`,
              "",
              "Maintainer checklist before merge:",
              "- Confirm the symptom, root cause, fix, and verification are real.",
              "- Confirm the contributor GitHub username is correct.",
              "- Run the release/test gates listed in CONTRIBUTING.md.",
              "",
              "After merge, publish the soul-ring loop:",
              "",
              "```bash",
              `cyberhuatuo ladder ${parsed.username} --framework ${framework}`,
              `cyberhuatuo ranking ${parsed.username}`,
              `cyberhuatuo card ${parsed.username}`,
              `cyberhuatuo campaign ${parsed.username} --framework ${framework}`,
              "```",
            ].join("\n");

            let pr;
            try {
              const createdPr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Promote Soul Ring prescription from #${issue.number}`,
                head: branch,
                base: baseBranch,
                body: prBody,
              });
              pr = createdPr.data;
            } catch (error) {
              if (error.status !== 422) throw error;
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                state: "open",
              });
              pr = pulls[0];
              if (!pr) throw error;
            }

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "soul-ring-promoted-pr",
                color: "8250df",
                description: "Accepted soul-ring issue has a promotion PR.",
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ["soul-ring-promoted-pr"],
            });

            const comment = [
              "## Soul Ring Prescription Promotion",
              "",
              `This accepted-prescription issue now has a case promotion PR: ${pr.html_url}`,
              "",
              "After the PR is merged, publish the contributor's next actions:",
              "",
              "```bash",
              `cyberhuatuo ladder ${parsed.username} --framework ${framework}`,
              `cyberhuatuo ranking ${parsed.username}`,
              `cyberhuatuo card ${parsed.username}`,
              `cyberhuatuo campaign ${parsed.username} --framework ${framework}`,
              "```",
              "",
              "This keeps the loop closed: accepted issue -> reviewable case PR -> real leaderboard data -> public soul-ring share card.",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment,
            });
